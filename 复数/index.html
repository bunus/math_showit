<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="description" content="复数：复平面表示、加减乘除、模与共轭的几何意义。">
<title>复数 · 动态教学实验室</title>
<style>
/* ============================================================
   平面向量及其应用 · Vector Lab
   ============================================================ */
:root{
  --bg:#060a12;
  --text:#eef7f6;
  --text-soft:#c3d5dc;
  --muted:#8ba1ac;
  --muted-2:#6f858f;
  --line:rgba(165,200,220,.11);
  --line-strong:rgba(165,200,220,.2);
  --accent:#5eead4;
  --accent-rgb:94,234,212;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman","Songti SC",serif;
  --mono:"Cascadia Code","SFMono-Regular","JetBrains Mono",Consolas,monospace;
  --radius:18px;
  --shadow:0 24px 60px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid rgba(var(--accent-rgb),.85);outline-offset:2px}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit}
::selection{background:rgba(var(--accent-rgb),.24);color:#fff}
[hidden]{display:none!important}

/* ---------- atmosphere ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(ellipse 70% 60% at 50% -12%,rgba(43,92,122,.2),transparent 64%),
  linear-gradient(180deg,#08101c 0%,#05090f 100%);}
.ambient::after{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(180,215,235,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(180,215,235,.028) 1px,transparent 1px);
  background-size:70px 70px;
  -webkit-mask-image:radial-gradient(ellipse 78% 68% at 46% 34%,#000 8%,transparent 78%);
  mask-image:radial-gradient(ellipse 78% 68% at 46% 34%,#000 8%,transparent 78%);
}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.glow-a{width:540px;height:540px;left:-140px;top:-220px;background:rgba(var(--accent-rgb),.1)}
.glow-b{width:640px;height:640px;right:-220px;bottom:-300px;background:rgba(104,86,210,.08)}

/* ---------- app ---------- */
.app{position:relative;z-index:1;height:100vh;height:100dvh;min-height:660px;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.topbar{flex:0 0 74px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  border:1px solid rgba(var(--accent-rgb),.3);
  background:linear-gradient(140deg,rgba(var(--accent-rgb),.18),rgba(var(--accent-rgb),.02));
  box-shadow:0 0 28px rgba(var(--accent-rgb),.14),inset 0 0 18px rgba(var(--accent-rgb),.05);
  transition:border-color .4s,box-shadow .4s;
}
.brand-mark svg{width:30px;height:30px;display:block}
.brand-copy{min-width:0}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.eyebrow i{width:13px;height:1px;background:rgba(255,255,255,.18);flex:none}
.brand h1{margin:3px 0 0;font-size:15px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.title-en{font-size:.64em;color:var(--muted);font-weight:400;letter-spacing:.14em}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.status-chip{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-size:10px;color:var(--text-soft);white-space:nowrap;letter-spacing:.04em;
}
.chip-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent);flex:none}
.ghost-btn,.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text-soft);
  border-radius:10px;padding:8px 12px;font-size:11px;cursor:pointer;
  transition:background .18s,border-color .18s,color .18s,transform .18s;white-space:nowrap;
}
.ghost-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.06);border-color:var(--line-strong);color:#fff}
.ghost-btn:active,.icon-btn:active{transform:translateY(1px)}
.ghost-btn svg{width:14px;height:14px}
.icon-btn{width:36px;height:36px;padding:0}
.icon-btn svg{width:16px;height:16px}

/* ---------- workspace ---------- */
.workspace{
  flex:1;min-height:0;display:grid;gap:11px;padding:0 16px 15px;
  grid-template-columns:minmax(248px,276px) minmax(0,1fr) minmax(298px,326px);
  grid-template-rows:minmax(0,1fr) 146px;
  grid-template-areas:"controls stage details" "catalog catalog catalog";
}
.panel,.stage-card,.catalog{
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,27,45,.9),rgba(8,15,27,.93));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.panel{min-height:0;border-radius:var(--radius);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.panel-controls{grid-area:controls;padding:15px 14px 14px;display:flex;flex-direction:column;gap:11px}
.panel-details{grid-area:details;padding:15px 14px 14px;display:flex;flex-direction:column;gap:10px}
.panel-controls>*,.panel-details>*{flex:0 0 auto}
.panel-head{display:flex;align-items:flex-start;gap:9px;min-width:0}
.section-num{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--accent);
  border:1px solid rgba(var(--accent-rgb),.25);background:rgba(var(--accent-rgb),.07);
  border-radius:7px;padding:4px 6px;line-height:1;margin-top:2px;flex:none;
}
.panel-head h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.04em;line-height:1.35}
.panel-head p{margin:2px 0 0;font-size:9.5px;color:var(--muted);letter-spacing:.03em}

/* ---------- chapter nav ---------- */
.chapter-list{display:flex;flex-direction:column;gap:2px}
.chapter-item{
  display:flex;align-items:center;gap:9px;min-width:0;padding:7px 9px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  cursor:pointer;text-align:left;transition:background .16s,color .16s,border-color .16s;
}
.chapter-item:hover{background:rgba(255,255,255,.045);color:var(--text-soft)}
.chapter-item.on{color:var(--tc);background:rgba(var(--tc-rgb),.09);border-color:rgba(var(--tc-rgb),.22)}
.ci-num{font-family:var(--mono);font-size:9px;opacity:.65;width:17px;flex:none}
.ci-name{font-size:12px;letter-spacing:.02em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ci-en{margin-left:auto;font-size:7px;letter-spacing:.13em;opacity:.4;white-space:nowrap}
.chapter-item.on .ci-en{opacity:.65}

.block-label{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding-top:10px;border-top:1px solid var(--line);
  font-size:8.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;
}
.block-label span:last-child{font-size:8px;letter-spacing:.04em;color:var(--muted-2);text-transform:none}

/* ---------- controls ---------- */
.controls{display:flex;flex-direction:column;gap:9px}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.ctrl-top b{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;margin:5px 0;
  background:linear-gradient(90deg,rgba(var(--accent-rgb),.72),rgba(var(--accent-rgb),.12));
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#0b1220;border:2px solid var(--accent);cursor:grab;
  box-shadow:0 0 12px rgba(var(--accent-rgb),.55);
}
input[type=range]::-moz-range-thumb{
  width:11px;height:11px;border-radius:50%;background:#0b1220;border:2px solid var(--accent);
  box-shadow:0 0 12px rgba(var(--accent-rgb),.55);
}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:11px;color:var(--text-soft);cursor:pointer;position:relative}
.switch > span{flex:1;line-height:1.45}
.switch input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.switch i{width:32px;height:18px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.07);position:relative;flex:none;transition:.2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#93a8b2;transition:.2s}
.switch input:checked + i{background:rgba(var(--accent-rgb),.3);border-color:rgba(var(--accent-rgb),.35)}
.switch input:checked + i::after{transform:translateX(14px);background:var(--accent);box-shadow:0 0 8px rgba(var(--accent-rgb),.7)}
.switch input:focus-visible + i{outline:2px solid rgba(var(--accent-rgb),.8);outline-offset:3px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  flex:1;min-width:84px;padding:8px 9px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(var(--accent-rgb),.28);background:rgba(var(--accent-rgb),.08);
  color:var(--accent);font-size:10.5px;letter-spacing:.02em;transition:.18s;
}
.btn:hover{background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accent-rgb),.45)}
.btn:active{transform:translateY(1px)}
.btn.ghost{border-color:var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
.btn.ghost:hover{color:var(--text-soft);border-color:var(--line-strong);background:rgba(255,255,255,.06)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seg button{padding:6px 3px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;transition:.18s;white-space:nowrap}
.seg button:hover{color:var(--text-soft)}
.seg button.on{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.26);color:var(--accent)}

/* ---------- stage ---------- */
.stage-card{
  grid-area:stage;position:relative;min-height:0;border-radius:var(--radius);overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 70% 64% at 52% 42%,rgba(var(--accent-rgb),.06),transparent 68%),
    radial-gradient(ellipse 55% 55% at 60% 108%,rgba(73,60,122,.1),transparent 72%),
    linear-gradient(180deg,#091321 0%,#060d17 100%);
}
.stage-card::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(190,225,238,.1) .7px,transparent .8px);
  background-size:26px 26px;opacity:.28;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 44%,#000,transparent 76%);
  mask-image:radial-gradient(ellipse 72% 72% at 50% 44%,#000,transparent 76%);
}
.stage-card::after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 90px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);
}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;touch-action:none;cursor:default}

.stage-top{position:absolute;z-index:7;top:13px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.live-badge{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:11px;
  background:rgba(5,11,20,.7);border:1px solid rgba(201,232,242,.1);
  backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.16);
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px rgba(var(--accent-rgb),.8);flex:none}
.live-copy{display:flex;flex-direction:column;gap:3px}
.live-copy strong{line-height:1.15}
.live-copy span{font-size:7.5px;color:var(--muted);letter-spacing:.12em}
.live-copy strong{font-size:12.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.live-idx{
  font-family:var(--mono);font-size:8.5px;color:var(--accent);
  background:rgba(var(--accent-rgb),.09);border:1px solid rgba(var(--accent-rgb),.18);
  border-radius:999px;padding:3px 6px;white-space:nowrap;
}
.stage-tools{display:flex;gap:6px;pointer-events:auto}
.mini-btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:9px;
  font-size:10px;color:var(--text-soft);cursor:pointer;
  border:1px solid rgba(201,236,228,.12);background:rgba(5,11,20,.62);
  backdrop-filter:blur(12px);transition:.18s;
}
.mini-btn:hover{background:rgba(14,28,44,.85);border-color:rgba(var(--accent-rgb),.3);color:#fff}
.stage-note{
  position:absolute;z-index:6;left:16px;bottom:86px;max-width:70%;
  font-family:var(--mono);font-size:8px;letter-spacing:.05em;
  color:rgba(170,200,212,.5);pointer-events:none;
}
.definition-bar{
  position:absolute;z-index:7;left:13px;right:13px;bottom:13px;
  display:flex;align-items:center;gap:11px;min-height:58px;padding:8px 11px;
  border:1px solid rgba(200,232,242,.11);border-radius:13px;
  background:rgba(5,12,21,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 16px 40px rgba(0,0,0,.2);
}
.definition-mark{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--accent);border:1px solid rgba(var(--accent-rgb),.26);background:rgba(var(--accent-rgb),.08);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;
}
.definition-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.def-title{font-size:7px;letter-spacing:.14em;color:var(--muted)}
.def-formula{font-family:var(--serif);font-size:14px;line-height:1.35;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.def-values{font-family:var(--mono);font-size:8.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- details ---------- */
.concept h3{margin:0;font-size:15.5px;line-height:1.45;font-weight:600;letter-spacing:.01em}
.concept .desc{margin:5px 0 0;font-size:11px;line-height:1.72;color:var(--text-soft)}
.desc b,.note-card b{color:#fff;font-weight:500}
.equation-card{
  border:1px solid rgba(var(--accent-rgb),.2);border-radius:13px;padding:9px 11px 7px;
  background:radial-gradient(ellipse 100% 120% at 0% 0%,rgba(var(--accent-rgb),.08),transparent 58%),rgba(0,0,0,.16);
}
.eq-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:8px;letter-spacing:.08em;color:var(--muted)}
.eq-head span:last-child{font-family:var(--mono);font-size:8px;color:var(--accent)}
.formula{
  font-family:var(--serif);font-size:17px;line-height:1.45;text-align:center;color:#fff;
  padding:7px 2px 6px;letter-spacing:.01em;text-shadow:0 0 20px rgba(var(--accent-rgb),.24);
  overflow-wrap:anywhere;
}
.formula sub,.formula sup{font-size:.6em}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hud-item{
  display:flex;flex-direction:column;gap:2px;min-width:0;
  padding:7px 9px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);
}
.hud-item span{font-size:8px;color:var(--muted);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-item b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-item.hi{border-color:rgba(var(--accent-rgb),.26);background:rgba(var(--accent-rgb),.07)}
.hud-item.hi b{color:var(--accent)}
.note-card{
  margin-top:auto;
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  background:rgba(255,255,255,.025);
}
.tip-card{
  margin-top:auto;border:1px solid var(--line);border-radius:11px;padding:9px 11px;
  background:rgba(255,255,255,.02);
}
.tip-card span{display:block;font-size:7.5px;letter-spacing:.13em;color:var(--muted-2);text-transform:uppercase;margin-bottom:3px}
.tip-card p{margin:0;font-size:9.5px;line-height:1.7;color:var(--muted)}
.metric-grid .hud-item:last-child:nth-child(odd){grid-column:1/-1}
.note-head{display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:.1em;color:var(--text-soft);text-transform:uppercase;margin-bottom:3px}
.note-icon{
  width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(var(--accent-rgb),.3);color:var(--accent);
  font-family:var(--serif);font-size:9px;line-height:1;
}
.note-card p{margin:0;font-size:10px;line-height:1.7;color:var(--muted)}
.note-card i{font-family:var(--serif);font-style:italic;color:var(--text-soft)}
.nw{white-space:nowrap}

/* ---------- catalog ---------- */
.catalog{
  grid-area:catalog;min-width:0;border-radius:var(--radius);
  padding:11px 15px 9px;display:flex;flex-direction:column;gap:7px;
}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.catalog-title{display:flex;align-items:flex-start;gap:9px;min-width:0}
.catalog-head h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.04em;line-height:1.35}
.catalog-head p{margin:1px 0 0;font-size:9px;color:var(--muted);letter-spacing:.03em}
.catalog-hint{font-size:8px;letter-spacing:.05em;color:var(--muted-2);white-space:nowrap;font-family:var(--mono)}
.catalog-track{
  display:flex;gap:6px;min-height:0;overflow-x:auto;overflow-y:hidden;
  padding-bottom:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;
}
.catalog-track::-webkit-scrollbar{height:4px}
.catalog-track::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.catalog-card{
  flex:1 1 0;min-width:126px;display:flex;flex-direction:column;gap:1px;
  padding:7px 10px 6px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);color:var(--text-soft);cursor:pointer;text-align:left;
  transition:background .16s,border-color .16s,box-shadow .16s;
}
.catalog-card:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.17)}
.catalog-card.on{border-color:rgba(var(--tc-rgb),.35);background:rgba(var(--tc-rgb),.08);box-shadow:inset 0 0 20px rgba(var(--tc-rgb),.05)}
.cc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--mono);font-size:7px;letter-spacing:.1em;color:var(--muted-2)}
.cc-top b{font-weight:500;color:inherit}
.catalog-card.on .cc-top{color:var(--tc)}
.catalog-card strong{font-size:11px;font-weight:600;line-height:1.5;color:var(--text-soft);white-space:nowrap}
.catalog-card.on strong{color:var(--tc)}
.catalog-card small{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- responsive ---------- */
@media(max-width:1240px){
  .workspace{grid-template-columns:minmax(228px,246px) minmax(0,1fr) minmax(272px,296px);gap:10px}
  .panel-controls,.panel-details{padding:13px 12px}
  .brand h1{font-size:14px}
}
@media(max-width:1020px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;min-height:100dvh}
  .topbar{flex:0 0 auto;flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1 1 100%}
  .top-actions{width:100%;justify-content:flex-end}
  .workspace{
    flex:none;display:flex;flex-direction:column;gap:10px;padding:0 12px 16px;
  }
  .stage-card{order:1;height:min(62vh,560px);min-height:400px;flex:none}
  .panel-controls{order:2;flex:none;overflow:visible}

<script>
'use strict';
/* ============================================================

const $ = s => document.querySelector(s);

const SANS = '"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
const TAU = Math.PI * 2;

let W = 800, H = 600, DPR = 1;
const V = {ox: 400, oy: 300, k: 60};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const X = x => V.ox + x * V.k;
const Y = y => V.oy - y * V.k;
const fmt = (n, d = 2) => {
  if (!isFinite(n)) return '—';
  return (Math.abs(n) < 5e-3 ? 0 : n).toFixed(d).replace('-', '−');
};

const len2 = (x, y) => Math.hypot(x, y);

function setFrame(cx, cy, span) {
  V.k = Math.min(W / span, H / (span * .62));

  V.oy = H * cy;
}
function lim() {
  return {
    x0: -V.ox / V.k + .25,
    x1: (W - V.ox) / V.k - .25,
    y0: -(H - V.oy) / V.k + .25,
    y1: V.oy / V.k - .25
  };

}

  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, size * .24);

}

  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, size * .24);

  ctx.fillText(txt, x, y);
  ctx.restore();
}
function arrow(a, b, color, opt) {
  opt = opt || {};

  if (L < 1) return;

  const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  let nx = -dy / L, ny = dx / L;

}
function segLabel(a, b, txt, color, frac, off, size) {
  frac = frac == null ? .5 : frac;
  off = off == null ? 16 : off;
  size = size || 12;
  const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y);
  const px = lerp(x1, x2, frac), py = lerp(y1, y2, frac);
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  let nx = -dy / L, ny = dx / L;
  if (ny > 0) { nx = -nx; ny = -ny; }
  off *= tscale();
  sans(txt, px + nx * off, py + ny * off, color, size);

function segMath(a, b, txt, color, frac, off, size) {
  frac = frac == null ? .5 : frac;
  off = off == null ? 16 : off;
  size = size || 17;
  const x1 = X(a.x), y1 = Y(a.y), x2 = X(b.x), y2 = Y(b.y);
  const px = lerp(x1, x2, frac), py = lerp(y1, y2, frac);
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  let nx = -dy / L, ny = dx / L;
  if (ny > 0) { nx = -nx; ny = -ny; }
  off *= tscale();
  math(txt, px + nx * off, py + ny * off, color, size);

function angleArc(c, th1, th2, r, color, txt, size = 15) {
  let d = ((th2 - th1 + Math.PI) % TAU + TAU) % TAU - Math.PI;
  if (Math.abs(d) < .02) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(X(c.x), Y(c.y), r, -th1, -(th1 + d), d > 0);
  ctx.stroke();
  ctx.restore();
  if (txt) {
    const mid = th1 + d / 2;
    sans(txt, X(c.x) + Math.cos(mid) * (r + 22), Y(c.y) - Math.sin(mid) * (r + 22), color, size);

function rightAngle(center, u, v, s, color) {
  const cx = X(center.x), cy = Y(center.y);
  const ux = u.x, uy = -u.y, vx = v.x, vy = -v.y;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([]);

  ctx.restore();
}
function vecText(p) {
  return '(' + fmt(p.x) + ', ' + fmt(p.y) + ')';
}

/* ============================================================
   控件构造
   ============================================================ */
function addSlider(parent, label, min, max, step, value, format, onInput) {
  const w = document.createElement('label');
  w.className = 'ctrl';
  const top = document.createElement('div');
  top.className = 'ctrl-top';
  const l = document.createElement('span');
  l.textContent = label;
  const b = document.createElement('b');
  b.textContent = format(value);
  top.append(l, b);
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = value;
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    b.textContent = format(v);
    onInput(v);
  });
  w.append(top, inp);
  parent.appendChild(w);
  return {
    input: inp,
    set(v, fire) {
      inp.value = v;
      b.textContent = format(v);
      if (fire) onInput(v);
    }
  };
}
function addToggle(parent, label, value, onChange) {
  const w = document.createElement('label');
  w.className = 'switch';
  const s = document.createElement('span');
  s.textContent = label;

  inp.type = 'checkbox';
  inp.checked = !!value;
  const i = document.createElement('i');
  inp.addEventListener('change', () => onChange(inp.checked));

}
function addBtn(parent, label, fn, cls) {

  b.className = 'btn ' + (cls || '');
  b.textContent = label;
  b.addEventListener('click', fn);
  parent.appendChild(b);
  return b;
}
function row(parent) {
  const r = document.createElement('div');
  r.className = 'row';
  parent.appendChild(r);
  return r;
}
const MODULES = [];

/* ============================================================
   必修第二册 · 第 7 章 复数
   复平面 · 加减 · 乘法旋转 · 共轭与模 · 圆的方程
   ============================================================ */
(function () {

/* ---------- 局部绘图小工具 ---------- */
function ring(c, rad, color, opt) {

  ctx.beginPath();
  ctx.arc(X(c.x), Y(c.y), Math.max(1, rad * V.k), 0, TAU);

const mod = z => Math.hypot(z.x, z.y);
const arg = z => Math.atan2(z.y, z.x);

/* ============================================================
   01 复平面与复数的表示
   ============================================================ */
MODULES.push({
  key: 'plane', tab: '01', name: '复平面表示', en: 'COMPLEX PLANE', blurb: '点与向量',
  accent: '#5eead4', rgb: '94,234,212',
  hint: '拖动点 z，观察实部、虚部、模与辐角',
  state: {z: {x: 2.5, y: 1.5}, proj: true, arc: true},
  reset() { this.state.z = {x: 2.5, y: 1.5}; this.state.proj = true; this.state.arc = true; },
  meta() {

      desc: '复数 z = a + bi 与复平面上的点 Z(a, b) 一一对应：a 是横坐标（实部），b 是纵坐标（虚部）。拖动点 z，虚线是它在两条坐标轴上的投影，线段 Oz 的长度就是模 |z|，它与实轴正方向的夹角就是辐角 θ。',
      formula: 'z = a + bi ⇔ 点 Z(a, b)<br>|z| = √(a² + b²)　θ = arg z',
      note: '当 b = 0 时 z 是实数，点落在实轴上；当 a = 0 且 b ≠ 0 时 z 是纯虚数，点落在虚轴上。辐角 θ ∈ (−π, π]，这里用角度显示。'

    line(c, z, 'rgba(255,197,107,.95)', {w: 1.8, dash: [5, 4]});
    segMath(c, z, 'r', '#ffc56b', .52, -15, 14);

    arrow({x: 0, y: 0}, z, 'rgba(255,143,171,.7)', {w: 1.4, head: 8});
    math('z', X(z.x) + 17, Y(z.y) - 14, '#ffb3c6', 16);
    sans('|z − z₀| = r', X(c.x), Y(c.y + r) - 16, 'rgba(255,179,198,.9)', 11);

    handle(c, '#b49cff', hoverId === 'c');
    handle(z, '#ffc56b', hoverId === 'z');
  },
  hud() {
    const s = this.state, c = s.c, r = s.r;
    const z = {x: c.x + r * Math.cos(s.phi), y: c.y + r * Math.sin(s.phi)};
    const cc = mod(c);
    return [
      {k: 'z₀', v: fC(c.x, c.y)},
      {k: 'r', v: fmt(r, 2)},
      {k: 'z', v: fC(z.x, z.y)},
      {k: '|z − z₀|', v: fmt(Math.hypot(z.x - c.x, z.y - c.y), 2), hi: true},
      {k: '|z| 范围', v: fmt(Math.abs(cc - r), 2) + ' ~ ' + fmt(cc + r, 2)}
    ];
  },
  panel(el) {
    const s = this.state;
    addSlider(el, '半径 r', .5, 3.2, .05, s.r, v => v.toFixed(2), v => s.r = v);
    addToggle(el, '显示 |z| 的最值点', s.ext, v => s.ext = v);
    addToggle(el, '让 z 在圆上匀速转动', s.spin, v => s.spin = v);
  }
});

})();


/* ============================================================
   引擎
   ============================================================ */
const chapterListEl = $('#chapterList');
const catalogEl = $('#catalogTrack');
let curIdx = 0, cur = null, hoverId = null, dragId = null, orbitId = null, orbitLast = null;

MODULES.forEach((m, i) => {
  m.en = m.en || '';
  m.blurb = m.blurb || '';

  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chapter-item';
  b.style.setProperty('--tc', m.accent);
  b.style.setProperty('--tc-rgb', m.rgb);
  b.innerHTML = '<span class="ci-num">' + m.tab + '</span>' +
    '<span class="ci-name">' + m.name + '</span>' +
    '<span class="ci-en">' + m.en + '</span>';
  b.addEventListener('click', () => activate(i));
  chapterListEl.appendChild(b);

  const c = document.createElement('button');
  c.type = 'button';
  c.className = 'catalog-card';
  c.style.setProperty('--tc', m.accent);
  c.style.setProperty('--tc-rgb', m.rgb);
  c.innerHTML = '<span class="cc-top"><b>' + m.tab + '</b><span>' + m.en + '</span></span>' +
    '<strong>' + m.name + '</strong><small>' + m.blurb + '</small>';
  c.addEventListener('click', () => activate(i));
  catalogEl.appendChild(c);
});

function plainFormula(html) {
  return html.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
function buildPanel() {
  const m = cur.meta();
  $('#title').textContent = m.title;
  $('#desc').innerHTML = m.desc;
  $('#formula').innerHTML = m.formula;
  $('#note').innerHTML = m.note;
  $('#stageFormula').textContent = plainFormula(m.formula);
  $('#eqTag').textContent = cur.tab;
  controlsEl.innerHTML = '';
  cur.panel(controlsEl);
}
const decodeBox = document.createElement('div');
function plainText(html) {
  decodeBox.innerHTML = html;
  return decodeBox.textContent;
}
function renderHud() {
  if (!cur) return;
  const rows = cur.hud();
  hudEl.innerHTML = rows.map(r =>
    '<div class="hud-item' + (r.hi ? ' hi' : '') + '"><span>' + r.k + '</span><b>' + r.v + '</b></div>'
  ).join('');
  $('#stageValues').textContent = rows.slice(0, 4).map(r => plainText(r.k + ' ' + r.v)).join('   ·   ');
}
function activate(i) {
  curIdx = i;
  cur = MODULES[i];
  root.style.setProperty('--accent', cur.accent);
  root.style.setProperty('--accent-rgb', cur.rgb);
  for (let j = 0; j < chapterListEl.children.length; j++) {
    chapterListEl.children[j].classList.toggle('on', j === i);
    catalogEl.children[j].classList.toggle('on', j === i);
  }
  cur.reset();
  hoverId = null;
  dragId = null;
  orbitId = null;
  orbitLast = null;
  buildPanel();
  const m = cur.meta();
  $('#liveName').textContent = cur.name;
  $('#liveIndex').textContent = cur.tab;
  $('#defMark').textContent = cur.tab;
  $('#topChip').innerHTML = '<span class="chip-dot"></span>第 ' + (i + 1) + ' / ' + MODULES.length + ' 节';
  $('#hint').textContent = cur.hint + ' · ← → 切换';
  const play = $('#playBtn');
  play.hidden = !cur.togglePlay;
  play.textContent = cur.key === 'add' ? '▶ 播放三角形法则' : '▶ 播放';
  renderHud();
  cv.style.cursor = canOrbit() ? 'grab' : 'default';
}

function resize() {
  const r = $('.stage-card').getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  W = r.width;
  H = r.height;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

let last = performance.now(), lastHud = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now;
  if (cur && W > 0) {
    ctx.clearRect(0, 0, W, H);
    cur.draw(dt);
    if (now - lastHud > 120) {
      lastHud = now;
      renderHud();
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- 指针交互 ---------- */
function pointAt(e) {
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (W / r.width);
  const sy = (e.clientY - r.top) * (H / r.height);
  return {sx, sy, wx: (sx - V.ox) / V.k, wy: (V.oy - sy) / V.k};
}
function pick(e) {
  if (!cur) return null;
  const p = pointAt(e);
  const hs = cur.handles() || [];
  let best = null, bd = 22;
  for (const h of hs) {
    const d = Math.hypot(X(h.x) - p.sx, Y(h.y) - p.sy);
    if (d < bd) { bd = d; best = h.id; }
  }
  return best;
}
function canOrbit() {
  return !!(cur && typeof cur.orbit === 'function' && (!cur.orbitEnabled || cur.orbitEnabled()));
}
cv.addEventListener('pointerdown', e => {
  if (!cur) return;
  const id = pick(e);
  if (id) {
    dragId = id;
    hoverId = id;
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
    e.preventDefault();
  } else if (canOrbit()) {
    orbitId = e.pointerId;
    orbitLast = {x: e.clientX, y: e.clientY};
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
cv.addEventListener('pointermove', e => {
  if (!cur) return;
  if (dragId) {
    const p = pointAt(e);
    cur.drag(dragId, {x: p.wx, y: p.wy});
    renderHud();
  } else if (orbitId !== null) {
    if (!canOrbit()) return;
    const dx = e.clientX - orbitLast.x;
    const dy = e.clientY - orbitLast.y;
    orbitLast = {x: e.clientX, y: e.clientY};
    cur.orbit(dx, dy);
    renderHud();
  } else {
    const id = pick(e);
    hoverId = id;
    cv.style.cursor = (id || canOrbit()) ? 'grab' : 'default';
  }
});
function endDrag() {
  dragId = null;
  orbitId = null;
  orbitLast = null;
  cv.style.cursor = canOrbit() ? 'grab' : 'default';
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => {
  if (dragId || orbitId !== null) return;
  hoverId = null;
  cv.style.cursor = canOrbit() ? 'grab' : 'default';
});

/* ---------- 顶部操作 ---------- */
$('#resetBtn').addEventListener('click', () => {
  if (!cur) return;
  cur.reset();
  buildPanel();
  renderHud();
});
$('#playBtn').addEventListener('click', () => { if (cur && cur.togglePlay) cur.togglePlay(); });
$('#fullBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    if (root.requestFullscreen) root.requestFullscreen();
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
});

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    activate((curIdx + 1) % MODULES.length);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    activate((curIdx - 1 + MODULES.length) % MODULES.length);
  } else if (e.code === 'Space') {
    e.preventDefault();
    if (cur && cur.togglePlay) cur.togglePlay();
  }
});

if (window.ResizeObserver) new ResizeObserver(resize).observe($('.stage-card'));
window.addEventListener('resize', resize);

resize();
activate(0);
requestAnimationFrame(loop);
</script>
